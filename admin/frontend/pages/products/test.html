<!-- 
  Test Page for Products Management API
  File: /admin/frontend/pages/products/test.html
  Usage: Mở trực tiếp trong browser để test các API
-->

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Products API</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: monospace;
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: #4ec9b0;
            margin-bottom: 20px;
        }

        .test-section {
            background: #252526;
            border: 1px solid #3e3e42;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 5px;
        }

        .test-section h2 {
            color: #9cdcfe;
            font-size: 16px;
            margin-bottom: 10px;
            border-bottom: 1px solid #3e3e42;
            padding-bottom: 10px;
        }

        .test-button {
            background: #0e639c;
            color: white;
            border: 1px solid #1e90ff;
            padding: 8px 15px;
            margin: 5px 5px 5px 0;
            border-radius: 3px;
            cursor: pointer;
            font-family: monospace;
            font-size: 12px;
        }

        .test-button:hover {
            background: #1177bb;
        }

        .test-input {
            background: #3c3c3c;
            color: #d4d4d4;
            border: 1px solid #3e3e42;
            padding: 8px;
            margin: 5px 5px 5px 0;
            border-radius: 3px;
            font-family: monospace;
            font-size: 12px;
        }

        .response {
            background: #1e1e1e;
            border: 1px solid #3e3e42;
            padding: 10px;
            margin-top: 10px;
            border-radius: 3px;
            max-height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-size: 11px;
        }

        .success {
            color: #4ec9b0;
        }

        .error {
            color: #f48771;
        }

        .info {
            color: #9cdcfe;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 Test Products Management API</h1>

        <!-- List Products -->
        <div class="test-section">
            <h2>📋 GET /api/products/list.php</h2>
            <div>
                <label>Page:</label>
                <input type="number" id="listPage" value="1" class="test-input" min="1">
                
                <label>Category ID:</label>
                <input type="number" id="listCategory" placeholder="(optional)" class="test-input">
                
                <label>Brand ID:</label>
                <input type="number" id="listBrand" placeholder="(optional)" class="test-input">
                
                <label>Status:</label>
                <select id="listStatus" class="test-input">
                    <option value="">-- All --</option>
                    <option value="active">active</option>
                    <option value="inactive">inactive</option>
                    <option value="out_of_stock">out_of_stock</option>
                </select>
                
                <label>Search:</label>
                <input type="text" id="listSearch" placeholder="product name or SKU" class="test-input">
                
                <button class="test-button" onclick="testListProducts()">Test</button>
            </div>
            <div id="listResponse" class="response"></div>
        </div>

        <!-- Get Product Detail -->
        <div class="test-section">
            <h2>📦 GET /api/products/get.php?id=</h2>
            <div>
                <label>Product ID:</label>
                <input type="number" id="getProductId" value="1" class="test-input">
                <button class="test-button" onclick="testGetProduct()">Test</button>
            </div>
            <div id="getResponse" class="response"></div>
        </div>

        <!-- Add Product -->
        <div class="test-section">
            <h2>➕ POST /api/products/add.php</h2>
            <div>
                <label>Product Name:</label>
                <input type="text" id="addName" placeholder="Test Product" class="test-input" style="width: 100%; margin-bottom: 10px;">
                
                <label>Category ID:</label>
                <input type="number" id="addCategory" value="8" class="test-input">
                
                <label>Brand ID:</label>
                <input type="number" id="addBrand" placeholder="(optional)" class="test-input">
                
                <label>SKU:</label>
                <input type="text" id="addSku" placeholder="TEST-SKU-001" class="test-input">
                
                <label>Price:</label>
                <input type="number" id="addPrice" value="100000" class="test-input">
                
                <label>Discount Price:</label>
                <input type="number" id="addDiscountPrice" value="0" class="test-input">
                
                <label>Stock Quantity:</label>
                <input type="number" id="addStock" value="50" class="test-input">
                
                <label>Status:</label>
                <select id="addStatus" class="test-input">
                    <option value="active">active</option>
                    <option value="inactive">inactive</option>
                    <option value="out_of_stock">out_of_stock</option>
                </select>
                
                <button class="test-button" onclick="testAddProduct()">Test</button>
            </div>
            <div id="addResponse" class="response"></div>
        </div>

        <!-- Update Product -->
        <div class="test-section">
            <h2>✏️ POST /api/products/update.php</h2>
            <div>
                <label>Product ID:</label>
                <input type="number" id="updateId" value="1" class="test-input">
                
                <label>Product Name:</label>
                <input type="text" id="updateName" placeholder="Updated Product" class="test-input" style="width: 100%; margin-bottom: 10px;">
                
                <label>Price:</label>
                <input type="number" id="updatePrice" value="95000" class="test-input">
                
                <button class="test-button" onclick="testUpdateProduct()">Test</button>
            </div>
            <div id="updateResponse" class="response"></div>
        </div>

        <!-- Delete Product -->
        <div class="test-section">
            <h2>🗑️ POST /api/products/delete.php</h2>
            <div>
                <label>Product ID:</label>
                <input type="number" id="deleteId" value="1" class="test-input">
                <button class="test-button" onclick="testDeleteProduct()">Test</button>
            </div>
            <div id="deleteResponse" class="response"></div>
        </div>

        <!-- Get Options -->
        <div class="test-section">
            <h2>🔧 GET /api/products/get-options.php</h2>
            <button class="test-button" onclick="testGetOptions()">Test</button>
            <div id="optionsResponse" class="response"></div>
        </div>
    </div>

    <script>
        const API_BASE = '/PetsAccessories/admin/backend/api/products';

        function displayResponse(elementId, data, isError = false) {
            const element = document.getElementById(elementId);
            if (typeof data === 'string') {
                element.textContent = data;
            } else {
                element.textContent = JSON.stringify(data, null, 2);
            }
            element.className = `response ${isError ? 'error' : 'success'}`;
        }

        async function testListProducts() {
            try {
                const page = document.getElementById('listPage').value;
                const category = document.getElementById('listCategory').value;
                const brand = document.getElementById('listBrand').value;
                const status = document.getElementById('listStatus').value;
                const search = document.getElementById('listSearch').value;

                let url = `${API_BASE}/list.php?page=${page}&limit=10`;
                if (category) url += `&category_id=${category}`;
                if (brand) url += `&brand_id=${brand}`;
                if (status) url += `&status=${status}`;
                if (search) url += `&search=${search}`;

                const response = await fetch(url);
                const data = await response.json();
                displayResponse('listResponse', data);
            } catch (error) {
                displayResponse('listResponse', error.message, true);
            }
        }

        async function testGetProduct() {
            try {
                const id = document.getElementById('getProductId').value;
                const response = await fetch(`${API_BASE}/get.php?id=${id}`);
                const data = await response.json();
                displayResponse('getResponse', data);
            } catch (error) {
                displayResponse('getResponse', error.message, true);
            }
        }

        async function testAddProduct() {
            try {
                const payload = {
                    product_name: document.getElementById('addName').value,
                    category_id: parseInt(document.getElementById('addCategory').value),
                    brand_id: document.getElementById('addBrand').value || null,
                    sku: document.getElementById('addSku').value || null,
                    price: parseFloat(document.getElementById('addPrice').value),
                    discount_price: parseFloat(document.getElementById('addDiscountPrice').value),
                    stock_quantity: parseInt(document.getElementById('addStock').value),
                    status: document.getElementById('addStatus').value
                };

                const response = await fetch(`${API_BASE}/add.php`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                displayResponse('addResponse', data);
            } catch (error) {
                displayResponse('addResponse', error.message, true);
            }
        }

        async function testUpdateProduct() {
            try {
                const payload = {
                    product_id: parseInt(document.getElementById('updateId').value),
                    product_name: document.getElementById('updateName').value,
                    category_id: 8,
                    price: parseFloat(document.getElementById('updatePrice').value),
                    discount_price: 0,
                    stock_quantity: 50,
                    status: 'active'
                };

                const response = await fetch(`${API_BASE}/update.php`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                displayResponse('updateResponse', data);
            } catch (error) {
                displayResponse('updateResponse', error.message, true);
            }
        }

        async function testDeleteProduct() {
            try {
                const payload = {
                    product_id: parseInt(document.getElementById('deleteId').value)
                };

                const response = await fetch(`${API_BASE}/delete.php`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                displayResponse('deleteResponse', data);
            } catch (error) {
                displayResponse('deleteResponse', error.message, true);
            }
        }

        async function testGetOptions() {
            try {
                const response = await fetch(`${API_BASE}/get-options.php`);
                const data = await response.json();
                displayResponse('optionsResponse', data);
            } catch (error) {
                displayResponse('optionsResponse', error.message, true);
            }
        }
    </script>
</body>
</html>
