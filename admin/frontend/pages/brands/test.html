<!-- 
  Test Page for Brands Management API
  File: /admin/frontend/pages/brands/test.html
  Usage: Mở trực tiếp trong browser để test các API
-->

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Brands API</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: monospace;
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: #4ec9b0;
            margin-bottom: 20px;
        }

        .test-section {
            background: #252526;
            border: 1px solid #3e3e42;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 5px;
        }

        .test-section h2 {
            color: #9cdcfe;
            font-size: 16px;
            margin-bottom: 10px;
            border-bottom: 1px solid #3e3e42;
            padding-bottom: 10px;
        }

        .test-button {
            background: #0e639c;
            color: white;
            border: 1px solid #1e90ff;
            padding: 8px 15px;
            margin: 5px 5px 5px 0;
            border-radius: 3px;
            cursor: pointer;
            font-family: monospace;
            font-size: 12px;
        }

        .test-button:hover {
            background: #1177bb;
        }

        .test-input {
            background: #3c3c3c;
            color: #d4d4d4;
            border: 1px solid #3e3e42;
            padding: 8px;
            margin: 5px 5px 5px 0;
            border-radius: 3px;
            font-family: monospace;
            font-size: 12px;
        }

        select.test-input {
            background: #3c3c3c;
            color: #d4d4d4;
        }

        textarea.test-input {
            font-family: monospace;
            min-height: 80px;
            resize: vertical;
        }

        .response {
            background: #1e1e1e;
            border: 1px solid #3e3e42;
            padding: 10px;
            margin-top: 10px;
            border-radius: 3px;
            max-height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-size: 11px;
        }

        .success {
            color: #4ec9b0;
        }

        .error {
            color: #f48771;
        }

        .info {
            color: #9cdcfe;
        }

        label {
            display: inline-block;
            min-width: 100px;
            margin-right: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 Test Brands Management API</h1>

        <!-- List Brands -->
        <div class="test-section">
            <h2>📋 GET /api/brands/list.php</h2>
            <div>
                <label>Page:</label>
                <input type="number" id="listPage" value="1" class="test-input" min="1">
                
                <label>Search:</label>
                <input type="text" id="listSearch" placeholder="brand name or description" class="test-input">
                
                <button class="test-button" onclick="testListBrands()">Test</button>
            </div>
            <div id="listResponse" class="response"></div>
        </div>

        <!-- Get Brand Detail -->
        <div class="test-section">
            <h2>🏷️ GET /api/brands/get.php?id=</h2>
            <div>
                <label>Brand ID:</label>
                <input type="number" id="getBrandId" value="1" class="test-input">
                <button class="test-button" onclick="testGetBrand()">Test</button>
            </div>
            <div id="getResponse" class="response"></div>
        </div>

        <!-- Add Brand -->
        <div class="test-section">
            <h2>➕ POST /api/brands/add.php</h2>
            <div>
                <label>Brand Name:</label>
                <input type="text" id="addName" placeholder="Test Brand" class="test-input" style="width: 100%; margin-bottom: 10px;">
                
                <label>Description:</label>
                <textarea id="addDescription" placeholder="Brand description..." class="test-input" style="width: 100%;"></textarea>
                
                <label>Logo (optional):</label>
                <input type="text" id="addLogo" placeholder="logo.png" class="test-input" style="width: 100%; margin-bottom: 10px;">
                
                <button class="test-button" onclick="testAddBrand()">Test</button>
            </div>
            <div id="addResponse" class="response"></div>
        </div>

        <!-- Update Brand -->
        <div class="test-section">
            <h2>✏️ POST /api/brands/update.php</h2>
            <div>
                <label>Brand ID:</label>
                <input type="number" id="updateId" value="1" class="test-input">
                
                <label>Brand Name:</label>
                <input type="text" id="updateName" placeholder="Updated Name" class="test-input" style="width: 100%; margin-bottom: 10px;">
                
                <label>Description:</label>
                <textarea id="updateDescription" placeholder="Updated description..." class="test-input" style="width: 100%;"></textarea>
                
                <button class="test-button" onclick="testUpdateBrand()">Test</button>
            </div>
            <div id="updateResponse" class="response"></div>
        </div>

        <!-- Delete Brand -->
        <div class="test-section">
            <h2>🗑️ POST /api/brands/delete.php</h2>
            <div>
                <label>Brand ID:</label>
                <input type="number" id="deleteId" value="1" class="test-input">
                <button class="test-button" onclick="testDeleteBrand()">Test</button>
            </div>
            <div id="deleteResponse" class="response"></div>
        </div>

        <!-- Get Options -->
        <div class="test-section">
            <h2>🔧 GET /api/brands/get-options.php</h2>
            <button class="test-button" onclick="testGetOptions()">Test</button>
            <div id="optionsResponse" class="response"></div>
        </div>
    </div>

    <script>
        const API_BASE = '/PetsAccessories/admin/backend/api/brands';

        function displayResponse(elementId, data, isError = false) {
            const element = document.getElementById(elementId);
            if (typeof data === 'string') {
                element.textContent = data;
            } else {
                element.textContent = JSON.stringify(data, null, 2);
            }
            element.className = `response ${isError ? 'error' : 'success'}`;
        }

        async function testListBrands() {
            try {
                const page = document.getElementById('listPage').value;
                const search = document.getElementById('listSearch').value;

                let url = `${API_BASE}/list.php?page=${page}&limit=10`;
                if (search) url += `&search=${search}`;

                const response = await fetch(url);
                const data = await response.json();
                displayResponse('listResponse', data);
            } catch (error) {
                displayResponse('listResponse', error.message, true);
            }
        }

        async function testGetBrand() {
            try {
                const id = document.getElementById('getBrandId').value;
                const response = await fetch(`${API_BASE}/get.php?id=${id}`);
                const data = await response.json();
                displayResponse('getResponse', data);
            } catch (error) {
                displayResponse('getResponse', error.message, true);
            }
        }

        async function testAddBrand() {
            try {
                const payload = {
                    brand_name: document.getElementById('addName').value,
                    description: document.getElementById('addDescription').value || null,
                    logo: document.getElementById('addLogo').value || null
                };

                const response = await fetch(`${API_BASE}/add.php`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                displayResponse('addResponse', data);
            } catch (error) {
                displayResponse('addResponse', error.message, true);
            }
        }

        async function testUpdateBrand() {
            try {
                const payload = {
                    brand_id: parseInt(document.getElementById('updateId').value),
                    brand_name: document.getElementById('updateName').value,
                    description: document.getElementById('updateDescription').value || null
                };

                const response = await fetch(`${API_BASE}/update.php`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                displayResponse('updateResponse', data);
            } catch (error) {
                displayResponse('updateResponse', error.message, true);
            }
        }

        async function testDeleteBrand() {
            try {
                const payload = {
                    brand_id: parseInt(document.getElementById('deleteId').value)
                };

                const response = await fetch(`${API_BASE}/delete.php`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                displayResponse('deleteResponse', data);
            } catch (error) {
                displayResponse('deleteResponse', error.message, true);
            }
        }

        async function testGetOptions() {
            try {
                const response = await fetch(`${API_BASE}/get-options.php`);
                const data = await response.json();
                displayResponse('optionsResponse', data);
            } catch (error) {
                displayResponse('optionsResponse', error.message, true);
            }
        }
    </script>
</body>
</html>
